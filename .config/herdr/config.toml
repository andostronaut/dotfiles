[ui.sidebar.spaces]
# Hand-written, and deliberately INSIDE radar's marker block: TOML forbids
# declaring [ui.sidebar.spaces] twice, and a copy outside the markers makes
# radar refuse to manage the agents block at all. radar has no setting to skip
# this table, so `configure` / `unconfigure` WILL overwrite these rows.
#
#   $pr         ● open/passing ◐ running ⊗ failed ◌ draft ◆ merged ⊘ closed
#   $pr_checks  passing/total, e.g. "✓ 12/12"
#   $pr_review  approved / changes requested / review needed
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  ["$pr", "$pr_checks", "$pr_review"],
]

