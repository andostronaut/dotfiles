# herdr — agent multiplexer for the terminal
# Docs:      https://herdr.dev/docs/
# Reference: https://herdr.dev/docs/config-reference/
#
# Installed location: ~/.config/herdr/config.toml
# Symlink just this file (herdr keeps logs, sockets, and session.json in that
# same dir, so don't symlink the whole directory):
#   ln -sf $(pwd)/.config/herdr/config.toml ~/.config/herdr/config.toml
#
# herdr runs fine with no config — everything below is optional and set to a
# sensible value with the default noted in a comment. Reload a running server
# after edits with `prefix+shift+r` or `herdr server reload-config`.
# Print the full commented defaults anytime with `herdr --default-config`.

# Show first-run onboarding. Set false once you've completed setup.
# (Top-level key — must stay above the [table] sections below.)
onboarding = false

# ── Theme ────────────────────────────────────────────────────────────────────
[theme]
# Built-in names include: kanagawa, catppuccin, catppuccin-latte, tokyo-night,
# nord, dracula, and "terminal" (follow your host terminal's ANSI palette).
# Full list: search theme.name in the config reference.
name = "rose-pine"

# Follow the host terminal's light/dark appearance and swap theme automatically.
# When enabled, herdr uses light_name / dark_name (or the theme's built-in
# light/dark sibling if those are unset). Manual selection in Settings disables it.
# rose-pine is the first theme here whose light sibling exists everywhere:
# rose-pine-dawn, Ghostty's "Rose Pine Dawn" and base46's rosepine-dawn.
# Still off because NvChad does not follow the terminal appearance, so
# flipping herdr and Ghostty alone would leave Neovim dark.
auto_switch = false
# light_name = "catppuccin-latte"
# dark_name  = "catppuccin"

# Override individual color tokens on top of the base theme (hex / named / rgb()).
# [theme.custom]
# accent = "#89b4fa"

# ── Terminal ─────────────────────────────────────────────────────────────────
[terminal]
default_shell = ""        # "" = use $SHELL, then /bin/sh
shell_mode    = "auto"    # auto | login | non_login
new_cwd       = "follow"  # follow | home | current | path — where new panes/tabs open

# ── Updates ──────────────────────────────────────────────────────────────────
[update]
channel        = "stable" # stable | preview
version_check  = true     # background check for new herdr versions
manifest_check = true     # background check for agent-detection manifest updates

# ── Keybindings ──────────────────────────────────────────────────────────────
# Only override what you want to change; unlisted keys keep their defaults.
[keys]
prefix = "ctrl+space"     # default is ctrl+b. herdr has no key-sequence syntax,
                          # so a double-tap prefix is not possible.
# A few common ones shown for reference (all at their defaults):
# split_vertical   = "prefix+v"       # side by side
# split_horizontal = "prefix+minus"   # stacked
# new_tab          = "prefix+c"
# zoom             = "prefix+z"
# toggle_sidebar   = "prefix+b"
# reload_config    = "prefix+shift+r"
# new_worktree     = "prefix+shift+g"

# ── Plugin keybindings ───────────────────────────────────────────────────────
# gecm.agents-usage exposes its modal as a pane entrypoint rather than an
# action, so it goes through the CLI. Inside the modal, r refreshes and any
# other key closes it.
[[keys.command]]
key = "prefix+u"
type = "shell"
command = "herdr plugin pane open --plugin gecm.agents-usage --entrypoint usage"
description = "Agents Usage: provider usage modal"

# usagebar registers real plugin actions, so those bind directly.
# usagebar's own open-limits action hardcodes --direction right, so call the
# CLI directly to get a split below instead.
[[keys.command]]
key = "prefix+shift+u"
type = "shell"
command = "herdr plugin pane open --plugin usagebar --entrypoint limits --placement split --direction down --focus"
description = "Agent Usage: open limits pane below"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "usagebar.refresh"
description = "Agent Usage: refresh sidebar meters"

# reviewr: comment on the agent's diff and send it back. Its README suggests
# cmd+r, prefix-based keeps it with the rest.
[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: toggle review pane"

# herdr-lazy manage pane. prefix+l is focus_pane_right, hence shift.
[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-lazy.manage"
description = "herdr-lazy: manage plugins"

# token-dashboard opens in its own tab
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "dave.token-dashboard.open-dashboard"
description = "Token Dashboard: open"

# spaces-pr-status. The sidebar tokens update on their own, these are for the
# board and for jumping to the PR.
[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "jmarbutt.spaces-pr-status.board"
description = "PR: board of every space by PR state"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "jmarbutt.spaces-pr-status.open"
description = "PR: open this space's pull request"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "jmarbutt.spaces-pr-status.checks"
description = "PR: this space's checks"

[[keys.command]]
key = "prefix+shift+y"
type = "plugin_action"
command = "jmarbutt.spaces-pr-status.refresh"
description = "PR: re-query GitHub, ignore caches"

# herdr-agent-quota. Its own README suggests prefix+shift+q for settings.
# `configure --apply` rewrites this config.toml, which is a tracked dotfile —
# run it only when you mean to, and check `git diff` afterwards.
[[keys.command]]
key = "prefix+shift+q"
type = "plugin_action"
command = "herdr-agent-quota.open-settings"
description = "Agent Quota: settings"

# The dashboard is a pane entrypoint rather than an action, so it goes through
# the CLI. prefix+f was freed when herdr-sidebar was removed.
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin pane open --plugin herdr-agent-quota --entrypoint dashboard --focus"
description = "Agent Quota: dashboard"

# ── UI & sidebar ─────────────────────────────────────────────────────────────
[ui]
sidebar_width          = 40        # default/target; auto-scales to workspace-name length
sidebar_min_width      = 40        # floor (default 18). Raise this to force a wider sidebar
                                   # even with short names; min == width == max pins it fixed.
sidebar_max_width      = 40        # ceiling (default 36)
sidebar_collapsed_mode = "compact" # compact | hidden
mouse_capture          = true      # herdr is mouse-first; keep this on
copy_on_select         = true
confirm_close          = true
pane_borders           = true
pane_gaps              = true
accent                 = "cyan"    # hex, named color, or rgb()
agent_panel_sort       = "priority" # spaces | priority — Agent sidebar ordering
show_agent_labels_on_pane_borders = true # label split panes with the detected agent

# Agent rows in the sidebar. $-tokens are pane metadata published by the
# usagebar plugin, the rest are herdr built-ins. This replaces herdr's default
# rows of [["state_icon", "workspace", "tab"], ["agent"]] — $title stands in for
# workspace/tab, and the two extra rows are what the plugin adds:
#   $provider  subscription provider, or backend for pay-as-you-go panes
#   $limit     shortest limit window remaining, e.g. "5h 72%"
#   $context   per-pane context use, e.g. "⛁ 13% (130k)"
[ui.sidebar.agents]
row_gap = 0                          # 1 restores the old blank line between agents
rows = [["state_icon", "$title", { token = "tab", bold = true, dim = false }, { token = "$quota_provider_model", bold = true, dim = false }], ["$provider", "$limit"], ["$context"], [{ token = "$quota_topic", bold = false, dim = false }], [{ token = "$quota_cache", bold = false, dim = false }, { token = "$quota_cache_ttl", bold = false, dim = false }, { token = "$quota_cache_state", fg = "#e4b957", bold = false, dim = false }, { token = "$quota_error", fg = "#e4b957", bold = false, dim = false }], [{ token = "$quota_context", bold = false, dim = false }, { token = "$quota_week_inline_normal", fg = "#82d978", bold = false, dim = false }, { token = "$quota_week_inline_warning", fg = "#e4b957", bold = false, dim = false }, { token = "$quota_week_inline_danger", fg = "#f16f7e", bold = false, dim = false }, { token = "$quota_week_inline_unknown", bold = false, dim = false }], [{ token = "$quota_5h_normal", fg = "#82d978", bold = false, dim = false }, { token = "$quota_5h_warning", fg = "#e4b957", bold = false, dim = false }, { token = "$quota_5h_danger", fg = "#f16f7e", bold = false, dim = false }, { token = "$quota_5h_unknown", bold = false, dim = false }, { token = "$quota_week_normal", fg = "#82d978", bold = false, dim = false }, { token = "$quota_week_warning", fg = "#e4b957", bold = false, dim = false }, { token = "$quota_week_danger", fg = "#f16f7e", bold = false, dim = false }, { token = "$quota_week_unknown", bold = false, dim = false }]]

# Space rows. Rows 1-2 are herdr's defaults; row 3 is spaces-pr-status, which
# puts GitHub PR state next to each branch:
#   $pr         glyph + number, e.g. "● #10110" or "◆ #10129 MERGED"
#               ● open/passing  ◐ running  ⊗ failed  ◌ draft  ◆ merged  ⊘ closed
#   $pr_checks  passing/total
#   $pr_review  approved, changes requested, review needed
# Tokens carry a TTL of four poll intervals, so the row blanks rather than
# going stale if the poller dies. A full row is ~32 columns, which fits the
# 40-wide sidebar in the default compact style — the emoji style is
# double-width and would need a wider sidebar.
[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  ["$pr", "$pr_checks", "$pr_review"],
]

# ── Notifications ────────────────────────────────────────────────────────────
# Great when you run background AI agents: get pinged when one finishes or needs
# input. delivery: off | herdr (in-app toast) | terminal | system (OS notifier).
[ui.toast]
delivery      = "herdr"
delay_seconds = 1                  # 0–3600; only fires if still in that state after the delay

[ui.toast.clipboard]
enabled = true                     # show the "copied" popup after a mouse copy

# ── Sound ────────────────────────────────────────────────────────────────────
[ui.sound]
enabled = true                     # chime when a background agent changes state
# path         = "~/.config/herdr/sounds/ping.mp3"  # override all sounds
# done_path    = "~/.config/herdr/sounds/done.mp3"
# request_path = "~/.config/herdr/sounds/request.mp3"

# Per-agent overrides: default | on | off
[ui.sound.agents]
claude = "default"
codex  = "default"
# droid defaults to off

# ── Session ──────────────────────────────────────────────────────────────────
[session]
resume_agents_on_restore = true    # resume AI-agent panes into their native sessions on restore

# ── Worktrees ────────────────────────────────────────────────────────────────
[worktrees]
directory = "~/.herdr/worktrees"   # root for <repo>/<branch-slug> checkouts

# ── Remote ───────────────────────────────────────────────────────────────────
[remote]
manage_ssh_config = true           # add keepalive + connection reuse for `herdr --remote`

# ── Advanced ─────────────────────────────────────────────────────────────────
[advanced]
scrollback_limit_bytes = 10000000  # per-pane scrollback cap (~10 MB)

# ── Experimental ─────────────────────────────────────────────────────────────
[experimental]
allow_nested   = false             # allow launching herdr inside a herdr pane
kitty_graphics = false             # experimental Kitty graphics for attached clients
pane_history   = false             # persist pane screen history to session-history.json

# clauth herdr plugin
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "clauth.open"
description = "clauth accounts"

# NOTE: `configure --apply` binds this to prefix+shift+r, which is herdr's own
# reload_config. Rebound to shift+f to pair with prefix+f (quota dashboard).
# Re-check this after any future `configure --apply`.
[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-agent-quota.refresh"
description = "Agent Quota: refresh all quotas"

# clauth herdr plugin: `$clauth` renders the account each Claude Code pane burns.
# rows_by_agent REPLACES rows for that agent rather than extending it, so
# `clauth herdr install` writing its own three rows here would have dropped the
# usagebar tokens above for Claude panes — the ones worth having. This is the
# rows list from [ui.sidebar.agents] with $clauth added beside $context.
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "$title", { token = "$quota_provider_model", bold = true }],
  ["$provider", "$limit"],
  ["$context", "$clauth"],
  [{ token = "$quota_cache" }, { token = "$quota_cache_ttl" }, { token = "$quota_cache_state", fg = "#e4b957" }, { token = "$quota_error", fg = "#e4b957" }],
  [{ token = "$quota_5h_normal", fg = "#82d978" }, { token = "$quota_5h_warning", fg = "#e4b957" }, { token = "$quota_5h_danger", fg = "#f16f7e" }, { token = "$quota_5h_unknown" }, { token = "$quota_week_normal", fg = "#82d978" }, { token = "$quota_week_warning", fg = "#e4b957" }, { token = "$quota_week_danger", fg = "#f16f7e" }, { token = "$quota_week_unknown" }],
]
