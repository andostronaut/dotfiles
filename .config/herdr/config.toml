# herdr — agent multiplexer for the terminal
# Docs:      https://herdr.dev/docs/
# Reference: https://herdr.dev/docs/config-reference/
#
# Installed location: ~/.config/herdr/config.toml
# Symlink just this file (herdr keeps logs, sockets, and session.json in that
# same dir, so don't symlink the whole directory):
#   ln -sf $(pwd)/.config/herdr/config.toml ~/.config/herdr/config.toml
#
# herdr runs fine with no config — everything below is optional and set to a
# sensible value with the default noted in a comment. Reload a running server
# after edits with `prefix+shift+r` or `herdr server reload-config`.
# Print the full commented defaults anytime with `herdr --default-config`.

# Show first-run onboarding. Set false once you've completed setup.
# (Top-level key — must stay above the [table] sections below.)
onboarding = false

# ── Theme ────────────────────────────────────────────────────────────────────
[theme]
# Built-in names include: kanagawa, catppuccin, catppuccin-latte, tokyo-night,
# nord, dracula, and "terminal" (follow your host terminal's ANSI palette).
# Full list: search theme.name in the config reference.
name = "vesper"

# Follow the host terminal's light/dark appearance and swap theme automatically.
# vesper is dark only, so there is nothing to switch to.
auto_switch = false
# light_name = "catppuccin-latte"

# dark_name is NOT decoration: herdr-radar's applyAppearance rewrites
# `name` on every configure and every light/dark flip, reading it from
# dark_name and falling back to a hardcoded "catppuccin" when it is unset.
# That fallback is how this file silently ended up on catppuccin. Setting it
# here is what makes vesper stick.
dark_name = "vesper"

# Override individual color tokens on top of the base theme (hex / named / rgb()).
# [theme.custom]
# accent = "#89b4fa"

# ── Terminal ─────────────────────────────────────────────────────────────────
[terminal]
default_shell = ""        # "" = use $SHELL, then /bin/sh
shell_mode    = "auto"    # auto | login | non_login
new_cwd       = "follow"  # follow | home | current | path — where new panes/tabs open

# ── Updates ──────────────────────────────────────────────────────────────────
[update]
channel        = "stable" # stable | preview
version_check  = true     # background check for new herdr versions
manifest_check = true     # background check for agent-detection manifest updates

# ── Keybindings ──────────────────────────────────────────────────────────────
# Only override what you want to change; unlisted keys keep their defaults.
[keys]
prefix = "ctrl+space"     # default is ctrl+b. herdr has no key-sequence syntax,
                          # so a double-tap prefix is not possible.
# A few common ones shown for reference (all at their defaults):
# split_vertical   = "prefix+v"       # side by side
# split_horizontal = "prefix+minus"   # stacked
# new_tab          = "prefix+c"
# zoom             = "prefix+z"
# toggle_sidebar   = "prefix+b"
# reload_config    = "prefix+shift+r"
# new_worktree     = "prefix+shift+g"

# reviewr: comment on the agent's diff and send it back. Its README suggests
# cmd+r, prefix-based keeps it with the rest. d for diff; bare prefix+d is not
# a herdr default (prefix+shift+d is close_workspace).
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: toggle review pane"

# gh-checks: the current PR's CI, checks and merge state in a split pane, the
# same toggled shape as reviewr. m for merge — prefix+p and prefix+shift+p are
# herdr's previous_tab and rename_pane.
#
# Its README also offers a $ci_* block for [ui.sidebar.spaces]. Deliberately
# NOT added: the pane carries everything except the sidebar glyphs, and that
# table is one of the three the sidebar plugins kept fighting over.
#
# Its [[startup]] block ran `herdr-gh-checks --sidebar` on every server start,
# a poller publishing $ci_* tokens for a sidebar block we never added. Removed
# from the installed manifest at
#   ~/.config/herdr/plugins/github/herdr-gh-checks-*/herdr-plugin.toml
# (a .bak sits beside it). Reinstalling or updating the plugin restores it —
# re-remove it then.
[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "herdr-gh-checks.show"
description = "GH Checks: PR CI, checks and merge"

# herdr-radar. Its --keys snippet asks for prefix+a, which is clauth's; shift+a
# keeps the "a for agents" mnemonic. prefix+comma is its own suggestion.
[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "hhdebb.herdr-radar.view-flip"
description = "Agents: active <-> recent"

[[keys.command]]
key = "prefix+comma"
type = "plugin_action"
command = "hhdebb.herdr-radar.settings"
description = "herdr-radar settings"

# herdr-lazy manage pane. prefix+l is focus_pane_right, hence shift.
[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-lazy.manage"
description = "herdr-lazy: manage plugins"

# ── UI & sidebar ─────────────────────────────────────────────────────────────
[ui]

# >>> herdr-radar tab-bar block
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = 'command', command = 'cat "/Users/ando/.local/state/herdr/plugins/hhdebb.herdr-radar/tabbar.txt"', interval_seconds = 6, timeout_seconds = 2 },
]
# <<< herdr-radar tab-bar block

sidebar_width          = 40        # default/target; auto-scales to workspace-name length
sidebar_min_width      = 40        # floor (default 18). Raise this to force a wider sidebar
                                   # even with short names; min == width == max pins it fixed.
sidebar_max_width      = 40        # ceiling (default 36)
sidebar_collapsed_mode = "compact" # compact | hidden
mouse_capture          = true      # herdr is mouse-first; keep this on
copy_on_select         = true
confirm_close          = true
pane_borders           = true
pane_gaps              = true
accent                 = "cyan"    # hex, named color, or rgb()
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true # label split panes with the detected agent
status_indicators = "symbols"
[ui.toast]
delivery      = "herdr"
delay_seconds = 1                  # 0–3600; only fires if still in that state after the delay

[ui.toast.clipboard]
enabled = true                     # show the "copied" popup after a mouse copy

# ── Sound ────────────────────────────────────────────────────────────────────
[ui.sound]
enabled = true                     # chime when a background agent changes state
# path         = "~/.config/herdr/sounds/ping.mp3"  # override all sounds
# done_path    = "~/.config/herdr/sounds/done.mp3"
# request_path = "~/.config/herdr/sounds/request.mp3"

# Per-agent overrides: default | on | off
[ui.sound.agents]
claude = "default"
codex  = "default"
# droid defaults to off

# ── Session ──────────────────────────────────────────────────────────────────
[session]
resume_agents_on_restore = true    # resume AI-agent panes into their native sessions on restore

# ── Worktrees ────────────────────────────────────────────────────────────────
[worktrees]
directory = "~/.herdr/worktrees"   # root for <repo>/<branch-slug> checkouts

# ── Remote ───────────────────────────────────────────────────────────────────
[remote]
manage_ssh_config = true           # add keepalive + connection reuse for `herdr --remote`

# ── Advanced ─────────────────────────────────────────────────────────────────
[advanced]
scrollback_limit_bytes = 10000000  # per-pane scrollback cap (~10 MB)

# ── Experimental ─────────────────────────────────────────────────────────────
[experimental]
allow_nested   = false             # allow launching herdr inside a herdr pane
kitty_graphics = false             # experimental Kitty graphics for attached clients
pane_history   = false             # persist pane screen history to session-history.json

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "clauth.open"
description = "clauth accounts"

# >>> herdr-radar theme block
[theme.custom]
active_row_bg = "#414868"
# <<< herdr-radar theme block

